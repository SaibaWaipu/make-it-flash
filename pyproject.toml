[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "make-it-flash"
version = "0.1.0"
description = "Streaming calibration, QSA/GDN teacher fitting, and adapter overlays for LLM-jp Qwen3-MoE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.5",
  "transformers>=5.5,<5.6",
  "datasets>=4.3,<5.0",
  "huggingface_hub>=1.21,<1.22",
  "accelerate>=1.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
make-it-flash = "make_it_flash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
